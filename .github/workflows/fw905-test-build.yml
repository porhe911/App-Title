      - name: Install LLVM 18 and SDK v0.41
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 unzip
          curl -fLsS --retry 3 https://github.com/ps5-payload-dev/sdk/releases/download/v0.41/ps5-payload-sdk.zip -o /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang++
      - name: Build standalone PS5 ELF
        shell: bash
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export PATH=/usr/lib/llvm-18/bin:$PATH
          make -j4
          python3 tools/verify_elf.py
          file dist/App_Title_v0.2.15.elf
          sha256sum dist/App_Title_v0.2.15.elf
          cp dist/App_Title_v0.2.15.elf dist/App_Title_FW905_TEST.elf
      - name: Upload test ELF
        uses: actions/upload-artifact@v4
        with:
          name: App_Title_FW905_TEST_not_runtime_verified
          path: dist/App_Title_FW905_TEST.elf
          if-no-files-found: error
          retention-days: 7
