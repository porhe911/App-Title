name: FW9.05 exact PS5 ELF release
on:
  push:
    branches:
      - release/fw905-profile-20261121
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare PS5 Payload SDK v0.41 and clang/LLD 18
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 unzip g++ gcc make binutils
          curl -fLsS --retry 3 https://github.com/ps5-payload-dev/sdk/releases/download/v0.41/ps5-payload-sdk.zip -o /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang++
      - name: Build embedded ShellUI and controller ELF from committed source
        shell: bash
        run: |
          set -euo pipefail
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export PATH=/usr/lib/llvm-18/bin:$PATH
          echo "cdcd08233e55530d74a66889e91018bf182bfaa0c4b843dc4d74bda0e76a3f77  src/home_style_fw905.inc" | sha256sum -c -
          make -j4
          python3 tools/verify_elf.py
          test "$(stat -c%s dist/App_Title_v0.2.15.elf)" = "299400"
          cp dist/App_Title_v0.2.15.elf dist/App_Title_FW905_R3.elf
          echo "e010cb4ca281a17874756267e7eb7fde97578de88b8ae77a10a793c505b60d6d  dist/App_Title_FW905_R3.elf" | sha256sum -c -
          file dist/App_Title_FW905_R3.elf
          printf 'e010cb4ca281a17874756267e7eb7fde97578de88b8ae77a10a793c505b60d6d  App_Title_FW905_R3.elf\n' > dist/SHA256SUMS_FW905.txt
      - name: Run native host regression checks
        shell: bash
        run: |
          set -euo pipefail
          make host-test
          make media-test
          make hooks-test
          make shellui-test
          make runtime-test
          make style-test
          make export-test
          make home-style-test
          make ram-style-test
      - name: Upload SHA-verified standalone test ELF
        uses: actions/upload-artifact@v4
        with:
          name: App_Title_FW905_R3_exact_console_tested
          path: |
            dist/App_Title_FW905_R3.elf
            dist/SHA256SUMS_FW905.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish ONLY verified FW9.05 release on accepted main merge
        if: "${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'fw905-publish-ready') }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          echo "e010cb4ca281a17874756267e7eb7fde97578de88b8ae77a10a793c505b60d6d  dist/App_Title_FW905_R3.elf" | sha256sum -c -
          if gh release view v0.2.15-fw905 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.2.15-fw905             dist/App_Title_FW905_R3.elf             dist/SHA256SUMS_FW905.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "App Title 0.2.15 · PS5 FW 9.05 (owner-tested R3)"             --notes-file RELEASE_NOTES_FW905.md             --latest
